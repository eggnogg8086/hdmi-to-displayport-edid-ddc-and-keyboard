; ESP32 Brightness Bridge v10.8
; This file is hot-reloaded automatically. Save it in Notepad; no restart needed.
;
; The bridge NEVER predicts from keyboard/mouse idle time. Prediction begins only
; after Windows itself reports that the interactive display has entered DIM.

[Display]
; Temporary brightness while Windows reports DIM.
; 50 means 50% of the user's normal brightness.
; Valid range: 1..100
DimPercent=50

[Prediction]
; 1 = anticipate the OFF command after a real Windows DIM event.
; 0 = never pre-blank; wait for Windows' authoritative OFF notification.
Enabled=1

; Learn this machine's real DIM->OFF interval from completed Windows cycles.
; Learned timing is stored separately in the registry and averaged over time.
LearningEnabled=1

; 1 = require at least one genuine Windows DIM->OFF sample before prediction.
; This makes the first cycle calibration-only and is the safest default.
; Ignored when LearningEnabled=0 (fixed timing mode).
RequireLearnedSample=1

; Before any predicted pre-OFF, check Windows' aggregate ES_DISPLAY_REQUIRED.
; If another app is requesting the display stay on, prediction is cancelled.
; Keep this enabled for normal use.
CheckDisplayRequired=1

; How long BEFORE the learned/expected Windows OFF moment to send VCP 0x10=0.
; Set this approximately to: ESP32 fade duration + desired safety margin.
; Larger = backlight starts fading earlier. Valid range: 0..10000 ms.
AdvanceMs=1400

; If a predicted pre-OFF is sent but Windows does not actually report OFF within
; this time, restore a visible DIM level automatically. This prevents a bad
; prediction from leaving the panel black. Valid range: 500..10000 ms.
PreOffConfirmTimeoutMs=2500

; Used until at least one valid DIM->OFF interval has been learned, or whenever
; learning is disabled. Typical Windows DIM->OFF cadence is often several seconds.
; Valid range: 1000..30000 ms.
FallbackDimToOffMs=5000

; Never issue a predicted pre-OFF sooner than this after Windows enters DIM,
; even if AdvanceMs is larger than the expected interval.
; Valid range: 100..5000 ms.
MinimumPredictionDelayMs=500

; Only DIM->OFF samples inside this range are accepted for learning. These bounds
; reject sleep/lid/policy anomalies from poisoning the timing estimate.
MinimumLearnIntervalMs=1500
MaximumLearnIntervalMs=15000
